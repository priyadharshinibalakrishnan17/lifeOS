<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sensora Dashboard</title>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            background:
                #f1f5f9;

            color:
                #1e293b;

        }


        header {

            background:

                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            color: white;

            padding:

                22px
                7%;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .title {

            font-size:
                23px;

            font-weight:
                bold;

        }


        .logout {

            background:

                #ef4444;

            color:

                white;

            border:

                none;

            padding:

                10px
                18px;

            border-radius:

                8px;

            cursor:

                pointer;

        }


        .container {

            max-width:

                1250px;

            margin:

                auto;

            padding:

                30px
                20px;

        }


        .stats {

            display:

                grid;

            grid-template-columns:

                repeat(
                    auto-fit,
                    minmax(220px,1fr)
                );

            gap:

                20px;

            margin-bottom:

                30px;

        }


        .card {

            background:

                white;

            padding:

                25px;

            border-radius:

                18px;

            box-shadow:

                0 5px
                20px
                rgba(0,0,0,0.08);

        }


        .card h3 {

            color:

                #64748b;

            font-size:

                14px;

            margin-bottom:

                15px;

        }


        .value {

            font-size:

                34px;

            font-weight:

                bold;

            color:

                #1d4ed8;

        }


        .grid {

            display:

                grid;

            grid-template-columns:

                repeat(
                    auto-fit,
                    minmax(400px,1fr)
                );

            gap:

                25px;

        }


        .panel {

            background:

                white;

            padding:

                25px;

            border-radius:

                18px;

            box-shadow:

                0 5px
                20px
                rgba(0,0,0,0.08);

        }


        .panel h2 {

            margin-bottom:

                20px;

            font-size:

                20px;

        }


        .status {

            text-align:

                center;

            font-size:

                28px;

            font-weight:

                bold;

            margin:

                25px 0;

        }


        .controls {

            display:

                flex;

            gap:

                12px;

            justify-content:

                center;

            flex-wrap:

                wrap;

        }


        .controls button {

            padding:

                12px
                22px;

            border:

                none;

            border-radius:

                10px;

            color:

                white;

            font-weight:

                bold;

            cursor:

                pointer;

        }


        .on {

            background:

                #16a34a;

        }


        .off {

            background:

                #dc2626;

        }


        .auto {

            background:

                #7c3aed;

        }


        .manual {

            background:

                #2563eb;

        }


        .history {

            margin-top:

                30px;

        }


        table {

            width:

                100%;

            border-collapse:

                collapse;

        }


        th {

            background:

                #1e3a8a;

            color:

                white;

        }


        th,
        td {

            padding:

                13px;

            text-align:

                center;

            border-bottom:

                1px solid
                #e2e8f0;

        }


        .table-container {

            overflow-x:

                auto;

        }


        .download {

            margin-top:

                20px;

            padding:

                13px
                25px;

            border:

                none;

            border-radius:

                10px;

            background:

                #2563eb;

            color:

                white;

            font-weight:

                bold;

            cursor:

                pointer;

        }


        @media(max-width:600px) {

            .grid {

                grid-template-columns:

                    1fr;

            }

        }

    </style>

</head>


<body>


    <header>

        <div class="title">

            💡 SENSORA
            | SMART HOME DASHBOARD

        </div>


        <button
            class="logout"
            id="logoutBtn"
        >

            Logout

        </button>


    </header>



    <div class="container">


        <!-- CURRENT VALUES -->


        <div class="stats">


            <div class="card">

                <h3>
                    🌡 TEMPERATURE
                </h3>

                <div
                    class="value"
                    id="temperature"
                >

                    -- °C

                </div>

            </div>



            <div class="card">

                <h3>
                    💧 HUMIDITY
                </h3>

                <div
                    class="value"
                    id="humidity"
                >

                    -- %

                </div>

            </div>



            <div class="card">

                <h3>
                    ☀ LDR LIGHT
                </h3>

                <div
                    class="value"
                    id="ldr"
                >

                    --

                </div>

            </div>


        </div>



        <div class="grid">


            <!-- BULB CONTROL -->


            <div class="panel">


                <h2>
                    💡 BULB STATUS
                </h2>


                <div
                    class="status"
                    id="bulbStatus"
                >

                    OFF

                </div>



                <div class="controls">


                    <button
                        class="auto"
                        id="autoBtn"
                    >

                        AUTOMATIC

                    </button>



                    <button
                        class="manual"
                        id="manualBtn"
                    >

                        MANUAL

                    </button>


                </div>



                <br>


                <h3
                    style="
                    text-align:center;
                    margin-bottom:15px;"
                >

                    Manual Control

                </h3>



                <div class="controls">


                    <button
                        class="on"
                        id="onBtn"
                    >

                        ON

                    </button>



                    <button
                        class="off"
                        id="offBtn"
                    >

                        OFF

                    </button>


                </div>


            </div>



            <!-- GRAPH -->


            <div class="panel">


                <h2>
                    📊 ENVIRONMENT HISTORY
                </h2>


                <canvas
                    id="sensorChart"
                ></canvas>


            </div>


        </div>



        <!-- HISTORY TABLE -->


        <div
            class="panel history"
        >


            <h2>
                📋 HISTORICAL DATA
            </h2>


            <div
                class="table-container"
            >


                <table>


                    <thead>

                        <tr>

                            <th>
                                Time
                            </th>

                            <th>
                                Temp
                            </th>

                            <th>
                                Humidity
                            </th>

                            <th>
                                LDR
                            </th>

                            <th>
                                Bulb
                            </th>

                            <th>
                                Mode
                            </th>

                        </tr>

                    </thead>



                    <tbody
                        id="historyTable"
                    >

                    </tbody>


                </table>


            </div>



            <button
                class="download"
                id="downloadBtn"
            >

                DOWNLOAD CSV

            </button>


        </div>


    </div>



    <script type="module">


        /* =========================
           FIREBASE IMPORTS
        ========================= */


        import {

            initializeApp

        }

        from

        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";



        import {

            getAuth,

            onAuthStateChanged,

            signOut

        }

        from

        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



        import {

            getDatabase,

            ref,

            onValue,

            set

        }

        from

        "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



        /* =========================
           FIREBASE CONFIG
        ========================= */


        const firebaseConfig = {

            apiKey:
                "AIzaSyB7Kg_G_oKJ3qTmwyvHL7ou4GtnDzK_Tqw",

            authDomain:
                "sensora-94289.firebaseapp.com",

            databaseURL:
                "https://sensora-94289-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "sensora-94289",

            storageBucket:
                "sensora-94289.firebasestorage.app",

            messagingSenderId:
                "953621638120",

            appId:
                "1:953621638120:web:e45f0a52f5dcd689f0125d",

            measurementId:
                "G-W34VES9JBW"

        };



        const app =

            initializeApp(
                firebaseConfig
            );



        const auth =

            getAuth(
                app
            );



        const database =

            getDatabase(
                app
            );



        /* =========================
           AUTH CHECK
        ========================= */


        onAuthStateChanged(

            auth,

            (user) => {


                if (!user) {


                    window.location.href =
                        "login.html";


                }


            }

        );



        /* =========================
           LOGOUT
        ========================= */


        document

        .getElementById("logoutBtn")

        .addEventListener(

            "click",

            () => {


                signOut(
                    auth
                );


            }

        );



        /* =========================
           DATABASE REFERENCES
        ========================= */


        const sensorRef =

            ref(
                database,
                "sensors"
            );



        const controlRef =

            ref(
                database,
                "control"
            );



        /* =========================
           SENSOR VALUES
        ========================= */


        onValue(

            sensorRef,

            (snapshot) => {


                const data =

                    snapshot.val();


                if (!data) return;



                document

                .getElementById(
                    "temperature"
                )

                .innerText =

                    (data.temperature ?? "--")
                    + " °C";



                document

                .getElementById(
                    "humidity"
                )

                .innerText =

                    (data.humidity ?? "--")
                    + " %";



                document

                .getElementById(
                    "ldr"
                )

                .innerText =

                    data.ldr ?? "--";


            }

        );



        /* =========================
           BULB CONTROL
        ========================= */


        document

        .getElementById("onBtn")

        .addEventListener(

            "click",

            () => {


                set(

                    ref(
                        database,
                        "control/bulb"
                    ),

                    "ON"

                );


            }

        );



        document

        .getElementById("offBtn")

        .addEventListener(

            "click",

            () => {


                set(

                    ref(
                        database,
                        "control/bulb"
                    ),

                    "OFF"

                );


            }

        );



        document

        .getElementById("manualBtn")

        .addEventListener(

            "click",

            () => {


                set(

                    ref(
                        database,
                        "control/mode"
                    ),

                    "MANUAL"

                );


            }

        );



        document

        .getElementById("autoBtn")

        .addEventListener(

            "click",

            () => {


                set(

                    ref(
                        database,
                        "control/mode"
                    ),

                    "AUTOMATIC"

                );


            }

        );



        /* =========================
           CONTROL STATUS
        ========================= */


        onValue(

            controlRef,

            (snapshot) => {


                const data =

                    snapshot.val();


                if (!data) return;



                document

                .getElementById(
                    "bulbStatus"
                )

                .innerText =

                    data.bulb ?? "OFF";


            }

        );


    </script>


</body>

</html>
